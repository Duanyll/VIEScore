[project]
name = "viescore"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets==4.0.0",
    "google-genai>=1.27.0",
    "insightface>=0.7.3",
    "ipython>=9.4.0",
    "numpy>=2.3.2",
    "onnxruntime-gpu>=1.22.0",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.1",
    "pillow==11.3.0",
    "protobuf==6.31.1",
    "regex==2024.11.6",
    "requests==2.32.4",
    "rich>=14.0.0",
]

[project.optional-dependencies]
localmllm = [
    "torch==2.7.1",
    "transformers==4.53.3",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
